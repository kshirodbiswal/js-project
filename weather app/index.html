<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
</head>
<link rel="stylesheet" href="style.css">

<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false">
            <button><img src="weatherImage/images/search.png" alt=""></button>
        </div>
  <div class="error">
    <p>Invalid city name</p>
  </div>
        <div class="weather">
            <img src="weatherImage/images/clouds.png" alt="" class="weather-icon">
            <h1 class="temp">25°C</h1>
            <h2 class="city"> New york</h2>
       

        <div class="details">
            <div class="col">
                <img src="weatherImage//images/humidity.png" alt="humidity">
                <div class="pos">
                    <p class="humidity">64%</p>
                    <p>humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="weatherImage//images/wind.png" alt="wind">
                <div class="pos">
                    <p class="wind">40km/h</p>
                    <p>wind speed</p>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
