<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Age Calculator</title>
  <!-- <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"> -->
   <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-gradient-to-br from-purple-600 to-indigo-500 min-h-screen flex items-center justify-center">
  <div class="text-center text-white p-6 rounded-lg">
    <h1 class="text-4xl font-bold">JavaScript</h1>
    <h2 class="text-3xl font-bold text-yellow-400 mt-2">Age Calculator</h2>

    <div class="mt-8 bg-white bg-opacity-10 p-6 rounded-lg backdrop-blur-sm inline-block">
      <div class="flex items-center gap-2">
        <input 
          type="date" 
          id="birthdate" 
          class="p-2 rounded bg-white text-black focus:outline-none"
        />
        <button 
          onclick="calculateAge()"
          class="bg-yellow-400 text-black px-4 py-2 rounded hover:bg-yellow-300"
        >
          Calculate
        </button>
      </div>
      <p id="result" class="mt-4 text-white text-lg font-medium"></p>
    </div>
  </div>

  <script>
    function calculateAge() {
      const birthdate = new Date(document.getElementById("birthdate").value);
      const today = new Date();

      let years = today.getFullYear() - birthdate.getFullYear();
      let months = today.getMonth() - birthdate.getMonth();
      let days = today.getDate() - birthdate.getDate();

      if (days < 0) {
        months--;
        days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      document.getElementById("result").textContent =
        `You are ${years} years, ${months} months and ${days} days old`;
    }
  </script>
</body>
</html>
