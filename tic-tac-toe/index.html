<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }

        .container {
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            background-color: #333;
            padding: 10px;
            border-radius: 10px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .cell:hover {
            background-color: #f0f0f0;
        }

        .status {
            margin-top: 20px;
            font-size: 24px;
            color: #333;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="board" id="board">
            <button class="cell">+</button>
            <button class="cell">-</button>
            <button class="cell">×</button>
            <button class="cell">-</button>
            <button class="cell">×</button>
            <button class="cell">-</button>
            <button class="cell">+</button>
            <button class="cell">-</button>
            <button class="cell">×</button>
        </div>
        <div class="status" id="status">X's turn</div>
        <button onclick="resetGame()">Reset Game</button>
    </div>

    <script>
        let currentPlayer = 'X';
        let gameBoard = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;

        const cells = document.querySelectorAll('.cell');
        const status = document.getElementById('status');

        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        function handleCellClick(e) {
            const cell = e.target;
            if (gameBoard[cell.index] !== '' || !gameActive) return;

            gameBoard[cell.index] = currentPlayer;
            cell.textContent = currentPlayer;

            if (checkWin()) {
                gameActive = false;
                status.textContent = `${currentPlayer} wins!`;
                return;
            }

            if (checkDraw()) {
                gameActive = false;
                status.textContent = "It's a tie!";
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            status.textContent = `${currentPlayer}'s turn`;
        }

        function checkWin() {
            const winningCombinations = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
                [0, 4, 8], [2, 4, 6] // Diagonals
            ];

            return winningCombinations.some(combination => {
                const index = combination.map(cellIndex => cellIndex).reduce(
                    (acc, current) => acc * 10 + parseInt(current),
                    0
                );

                if (gameBoard[index] === currentPlayer) {
                    alert(`${currentPlayer} wins!`);
                    return true;
                }
            });
        }

        function checkDraw() {
            return gameBoard.every(cell => cell !== '');
        }

        function resetGame() {
            gameBoard = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 'X';
            status.textContent = `${currentPlayer}'s turn`;
            cells.forEach(cell => {
                cell.textContent = '';
            });
        }
    </script>
</body>
</html>
