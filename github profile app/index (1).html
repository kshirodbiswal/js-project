<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profiles</title>
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
   <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-[#1a1a7a] flex flex-col items-center justify-center min-h-screen p-4">
  
  <!-- Input -->
  <input 
    type="text" 
    placeholder="search github profile" 
    class=" bg-gradient-to-r from-purple-600 to-purple-800 text-white px-4 py-2 rounded-md shadow-md w-full max-w-md text-left focus:outline-none"
  />

  <!-- Profile Card -->
  <div class="mt-8 bg-gradient-to-r from-purple-600 to-purple-800 text-white p-6 rounded-xl w-full max-w-xl shadow-lg">
    <div class="flex items-center space-x-6">
      <!-- Avatar -->
      <img 
        src="https://avatars.githubusercontent.com/u/9919?s=200&v=4" 
        alt="Avatar" 
        class="w-20 h-20 rounded-full border-4 border-white object-cover"
      />

      <!-- Info -->
      <div>
        <h2 class="text-xl font-bold">Name</h2>
        <p class="text-sm">Bio</p>
        <div class="flex space-x-4 text-sm mt-2">
          <span>## Followers</span>
          <span>## Following</span>
          <span>## Repos</span>
        </div>
        <!-- Repos -->
        <div class="flex space-x-2 mt-3 text-sm">
          <span class="bg-white text-purple-800 px-2 py-1 rounded">Repo 1</span>
          <span class="bg-white text-purple-800 px-2 py-1 rounded">Repo 2</span>
          <span class="bg-white text-purple-800 px-2 py-1 rounded">Repo 3</span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
